name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & Build Frontend
        run: |
          cd frontend
          npm install
          VITE_GITHUB_MODE=true VITE_BASE=/Supremas/ VITE_GITHUB_TOKEN=${{ secrets.GH_PAT || '' }} npm run build
          cp dist/index.html dist/404.html
        env:
          VITE_GITHUB_MODE: true
          VITE_BASE: /Supremas/
          VITE_GITHUB_TOKEN: ${{ secrets.GH_PAT }}

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
